[package]
name = "cmr"
version = "0.2.1"
edition = "2021"
description = "Claude Model Router: cross-platform CLI and opt-in Claude Code Mod"
license = "MIT"
repository = "https://github.com/Weslley08/cmr"
readme = "README.md"
keywords = ["claude-code", "models", "hooks", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "cmr"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
