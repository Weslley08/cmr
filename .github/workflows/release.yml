name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: Validate routing Mod before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Mod and tests
        run: |
          node --check plugins/model-router/hooks/register.mjs
          node --check plugins/model-router/hooks/policy.mjs
          node --test plugins/model-router/tests/*.test.mjs
          node scripts/check-mod.mjs
      - name: Verify Cargo and plugin versions match
        shell: bash
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PLUGIN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('plugins/model-router/.claude-plugin/plugin.json','utf8')).version")
          test "${CARGO_VERSION}" = "${PLUGIN_VERSION}" || { echo "Version mismatch"; exit 1; }

  package:
    needs: mod
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v${VERSION}"
            exit 1
          fi
      - name: Run native tests
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/cmr-${{ matrix.target }}.tar.gz cmr
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/cmr.exe" -DestinationPath "dist/cmr-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cmr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cmr-*
          merge-multiple: true
          path: dist
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum cmr-* > SHA256SUMS
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "CMR ${GITHUB_REF_NAME}"
