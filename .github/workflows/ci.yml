name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / format lint test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release

  mod:
    name: Mod / policy, hooks and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check plugins/model-router/hooks/register.mjs
          node --check plugins/model-router/hooks/policy.mjs
      - name: Mod tests
        run: node --test plugins/model-router/tests/*.test.mjs
      - name: Check marketplace layout
        run: node scripts/check-mod.mjs

  native-platforms:
    name: Native / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native tests
        run: cargo test --all-targets
      - name: Native release build
        run: cargo build --release --target ${{ matrix.target }}

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      # Gitleaks compares commits on pull_request; a shallow clone can omit
      # their parents and cause 'failed to scan Git repository: stderr is not empty'.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
