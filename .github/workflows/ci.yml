name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release

  mod:
    name: Mod / unit tests and marketplace manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test routing and hooks
        run: node --test plugins/model-router/tests/*.test.js
      - name: Validate JSON and plugin paths
        run: node scripts/check-marketplace.mjs
      - name: JavaScript syntax
        run: |
          node --check plugins/model-router/hooks/register.js
          node --check plugins/model-router/hooks/router-core.js

  secrets:
    name: Secrets / accidental credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
